%YAML:1.0

# Initial OpenVINS/MSCKF configuration for the UAV GNC PX4/Gazebo stereo rig.
# This is a simulation-start config, not a real-camera calibration result.

verbosity: "INFO"

use_fej: true
integration: "rk4"
use_stereo: true
max_cameras: 2

# Keep calibration fixed for the first Gazebo integration pass. After /vio/odom
# is stable, these can be enabled one at a time for sensitivity tests.
calib_cam_extrinsics: false
calib_cam_intrinsics: false
calib_cam_timeoffset: false
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 11
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 40
dt_slam_delay: 1
gravity_mag: 9.81

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

try_zupt: false
zupt_chi2_multipler: 0
zupt_max_velocity: 0.1
zupt_noise_multiplier: 10
zupt_max_disparity: 0.5
zupt_only_at_beginning: false

init_window_time: 1.5
init_imu_thresh: 0.45
init_max_disparity: 15.0
init_max_features: 50
init_dyn_use: false
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 6
init_dyn_min_deg: 10.0
init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-20
init_dyn_bias_g: [0.0, 0.0, 0.0]
init_dyn_bias_a: [0.0, 0.0, 0.0]

record_timing_information: false
record_timing_filepath: "/tmp/uav_gnc_openvins_timing.txt"

save_total_state: false
filepath_est: "/tmp/uav_gnc_openvins_estimate.txt"
filepath_std: "/tmp/uav_gnc_openvins_estimate_std.txt"
filepath_gt: "/tmp/uav_gnc_openvins_groundtruth.txt"

# Front-end feature tracking. KLT is the usual starting point for real-time VIO.
use_klt: true
num_pts: 200
fast_threshold: 20
grid_x: 5
grid_y: 5
min_px_dist: 15
knn_ratio: 0.65
track_frequency: 30.0
downsample_cameras: false
num_opencv_threads: 4
histogram_method: "HISTOGRAM"

fi_min_dist: 0.25
fi_max_dist: 80.0
fi_max_baseline: 200
fi_max_cond_number: 20000
fi_triangulate_1d: false

use_aruco: false
num_aruco: 1024
downsize_aruco: true

up_msckf_sigma_px: 1.5
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1.5
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

use_mask: false

relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"

